<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Employee - Employee Management</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #e3f2fd, #f5f7fa);
        min-height: 100vh;
    }

    /* Header */
    header {
        background: linear-gradient(90deg, #1565c0, #42a5f5);
        color: white;
        padding: 25px;
        text-align: center;
        box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    header h1 {
        font-size: 30px;
        letter-spacing: 1px;
    }

    /* Form Card */
    .form-container {
        width: 420px;
        margin: 50px auto;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .form-container h2 {
        text-align: center;
        color: #1565c0;
        margin-bottom: 30px;
    }

    /* Form group */
    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #333;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
    }

    .form-group input:focus {
        border-color: #1565c0;
        box-shadow: 0 0 5px rgba(21,101,192,0.3);
    }

    /* Submit Button */
    .submit-btn {
        width: 100%;
        padding: 12px;
        background: #1565c0;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background: #0d47a1;
        transform: translateY(-1px);
    }

    /* Back button */
    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #1565c0;
        text-decoration: none;
        font-weight: bold;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 500px) {
        .form-container {
            width: 90%;
            margin-top: 35px;
        }
    }

</style>

</head>

<body>

<header>
    <h1>Employee Management System</h1>
</header>

<div class="form-container">

    <h2>Add Employee</h2>

    <form action="addEmployees" method="post">

        <div class="form-group">
            <label for="employee_name">Employee Name</label>
            <input
                id="employee_name"
                name="employee_name"
                type="text"
                placeholder="Enter employee name"
                required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter email"
                required>
        </div>

        <div class="form-group">
            <label for="phone_number">Phone Number</label>
            <input
                id="phone_number"
                name="phone_number"
                type="tel"
                placeholder="Enter phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required>
        </div>

        <div class="form-group">
            <label for="salary">Salary</label>
            <input
                id="salary"
                name="salary"
                type="number"
                placeholder="Enter salary"
                min="0"
                required>
        </div>

        <button type="submit" class="submit-btn">
            Add Employee
        </button>

    </form>

    <a href="employees" class="back-link">
        ← Back to Employees
    </a>

</div>

</body>
</html>
