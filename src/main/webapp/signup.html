<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee Management - Signup</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #f5f7fa);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(90deg, #1565c0, #42a5f5);
            padding: 25px;
            text-align: center;
            color: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 30px;
            letter-spacing: 1px;
        }

        /* Signup Card */
        .signup-container {
            width: 380px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .signup-container h2 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 30px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #1565c0;
            box-shadow: 0 0 5px rgba(21, 101, 192, 0.3);
        }

        /* Signup Button */
        .signup-btn {
            width: 100%;
            padding: 12px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background: #0d47a1;
            transform: translateY(-1px);
        }

        /* Login Link */
        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
        }

        .login-link a {
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
            margin-left: 5px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 450px) {
            .signup-container {
                width: 90%;
                margin-top: 40px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to Tech</h1>
    </header>

    <div class="signup-container">

        <h2>Create Account</h2>

        <form action="signup" method="post">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="signup-btn">
                Sign Up
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="index.html">Login</a>
        </p>

    </div>

</body>
</html>
